# examples/icmp_abnormal_named.yaml
#
# ICMPv4 异常响应示例:使用命名 type/code,并在每条响应前放置触发包。
link_type: ethernet
seed: 42
packets:
  - name: udp-probe-net-unreachable
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.1", ttl: 64 }
      - udp:  { sport: 40000, dport: 65000 }
      - payload:
          payload: "probe net"

  - name: icmp-destination-unreachable-net-unreachable
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: destination_unreachable
          code: net_unreachable
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "10.0.0.1", ttl: 64 }
              - udp: { sport: 40000, dport: 65000 }
              - payload:
                  payload: "probe net"

  - name: udp-probe-host-unreachable
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.2", ttl: 64 }
      - udp:  { sport: 40000, dport: 65001 }
      - payload:
          payload: "probe host"

  - name: icmp-destination-unreachable-host-unreachable
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: destination_unreachable
          code: host_unreachable
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "10.0.0.2", ttl: 64 }
              - udp: { sport: 40000, dport: 65001 }
              - payload:
                  payload: "probe host"

  - name: udp-probe-protocol-unreachable
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.3", ttl: 64 }
      - udp:  { sport: 40000, dport: 65002 }
      - payload:
          payload: "probe protocol"

  - name: icmp-destination-unreachable-protocol-unreachable
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: destination_unreachable
          code: protocol_unreachable
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "10.0.0.3", ttl: 64 }
              - udp: { sport: 40000, dport: 65002 }
              - payload:
                  payload: "probe protocol"

  - name: udp-probe-port-unreachable
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.4", ttl: 64 }
      - udp:  { sport: 40000, dport: 65003 }
      - payload:
          payload: "probe port"

  - name: icmp-destination-unreachable-port-unreachable
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: destination_unreachable
          code: port_unreachable
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "10.0.0.4", ttl: 64 }
              - udp: { sport: 40000, dport: 65003 }
              - payload:
                  payload: "probe port"

  - name: udp-probe-fragmentation-needed
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.5", ttl: 64 }
      - udp:  { sport: 40000, dport: 65004 }
      - payload:
          payload: "probe frag"

  - name: icmp-destination-unreachable-fragmentation-needed
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: destination_unreachable
          code: fragmentation_needed
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "10.0.0.5", ttl: 64 }
              - udp: { sport: 40000, dport: 65004 }
              - payload:
