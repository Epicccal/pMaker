              - udp: { sport: 40000, dport: 65005 }
              - payload:
                  payload: "probe route"

  - name: udp-probe-ttl-exceeded
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "8.8.8.8", ttl: 1 }
      - udp:  { sport: 40000, dport: 65006 }
      - payload:
          payload: "probe ttl"

  - name: icmp-time-exceeded-ttl-exceeded
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.254", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: time_exceeded
          code: ttl_exceeded
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "8.8.8.8", ttl: 1 }
              - udp: { sport: 40000, dport: 65006 }
              - payload:
                  payload: "probe ttl"

  - name: udp-probe-fragment-reassembly-time-exceeded
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "8.8.4.4", ttl: 64 }
      - udp:  { sport: 40000, dport: 65007 }
      - payload:
          payload: "probe reassembly"

  - name: icmp-time-exceeded-fragment-reassembly
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.254", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: time_exceeded
          code: fragment_reassembly_time_exceeded
          quote:
            stack:
              - ipv4: { src: "10.0.0.10", dst: "8.8.4.4", ttl: 64 }
              - udp: { sport: 40000, dport: 65007 }
              - payload:
                  payload: "probe reassembly"
