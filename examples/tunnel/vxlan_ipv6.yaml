# examples/tunnel/vxlan_ipv6.yaml
#
# 示例场景:VXLAN 双栈(外层 IPv6 + UDP 4789 + VNI 200,内层 IPv6 + TCP SYN)。
# 验证 outer/inner 网络层串接与 checksum 就近绑定:内层 TCP 绑定内层 IPv6 伪首部。
link_type: ethernet
packets:
  - stack:
      - eth:   { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv6:  { src: "2001:db8::10", dst: "2001:db8::20", hop_limit: 64 }
      - udp:   { sport: 49153, dport: 4789 }
      - vxlan: { vni: 200 }
      - eth:   { src: "00:22:33:44:55:66", dst: "00:33:44:55:66:77" }
      - ipv6:  { src: "fd00::10", dst: "fd00::20", hop_limit: 64 }
      - tcp:   { sport: 40001, dport: 443, flags: [SYN], seq: 2000 }
