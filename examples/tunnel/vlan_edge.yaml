# 示例场景:VLAN / QinQ 边界与覆盖行为(可执行版)。
#
# 与 ethertype_derive.yaml 互补:那边锁定自动推导值,这边锁定**显式覆盖**与
# **12 位 VID 边界**在 wire 上的落值:
#   - eth.ethertype 显式覆盖(0x9100 非标 TPID,gopacket 默认不解,设备兼容性用例)
#   - vlan.type 显式覆盖(双层标签间非标 TPID 0x88a8)
#   - vlan.type 断链覆盖(0xffff,解析端在标签处断链)
#   - vid 边界:0(priority tag)与 4095(12 位最大值,保留值)
#   - pri(PCP)与 dei:TCI 高 4 位落值(非零 PCP、DEI 置位)
#   - vid: 4096 会在 scenario.Validate 阶段报 vlan.vid 超出 12 位,须走 payload_hex
link_type: ethernet
packets:
  # ① eth.ethertype 显式覆盖:非标 QinQ 外层 TPID 0x9100(设备兼容性用例;
  #    gopacket 回读不会把 0x9100 解为 Dot1Q,wire 字节正确即可)
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb", ethertype: 0x9100 }
      - vlan: { vid: 100 }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - udp:  { sport: 50000, dport: 53 }

  # ② 中间层 vlan.type 显式覆盖:外层 C-TAG → 内层标签间 TPID 0x88a8(非标)
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - vlan: { vid: 100, type: 0x88a8 }
      - vlan: { vid: 200 }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - udp:  { sport: 50001, dport: 53 }

  # ③ vlan.type 断链:标签后声明的 next 与实际不符(0xffff 无效 EtherType)
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - vlan: { vid: 100, type: 0xffff }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }

  # ④ VID 边界:vid 0 = priority tag;vid 4095 = 12 位最大值(保留值)
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - vlan: { vid: 0 }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - udp:  { sport: 50002, dport: 53 }

  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - vlan: { vid: 4095 }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - udp:  { sport: 50002, dport: 53 }

  # ⑤ pri(PCP)=5 + dei 置位:TCI = 5<<13 | 1<<12 | 100(QoS 优先级队列/丢弃策略验证)
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - vlan: { vid: 100, pri: 5, dei: true }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - udp:  { sport: 50003, dport: 53 }
