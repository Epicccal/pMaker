# examples/interleave/cross_flow_independence.yaml
#
# 演示"跨流时间独立":每条 flow 独立起步、可并行(flow.offset_time 仍相对 base);一条 flow
# 内部的 message.offset_time(相对上一条消息)不会把另一条 flow 拖到插队时刻之后
# (问题 #1:跨流劫持在新模型下天然不成立)。
#
# flow-A 内部第三条消息 GET /late 用 offset_time: +5s 钉到"上一条消息(200 OK)末尾 +5s"
# (模拟延迟到达的请求)。flow-B 没有 offset_time,在 base 起步并发——不接续 flow-A,故完全
# 不受 flow-A 内部 +5s 的影响。
#
# 时间线(base=2024-01-01T00:00:00Z,默认步长 1ms;两 flow 并发,同 Time 包按声明序排列):
#
#   flow-A 握手:          base+0/1/2ms
#   flow-A GET /a:        base+3ms(data) / base+4ms(ack),末尾 5ms
#   flow-A 200 OK:        base+5ms(data) / base+6ms(ack),末尾 7ms
#   flow-A GET /late:     base+5.007s(data) / base+5.008s(ack)   ← 200 OK 末尾(7ms)+5s
#   flow-A 挥手:          base+5.009s 起 4 个包(接在最后一条消息之后)
#
#   flow-B(无 offset)在 base 起步并发,与 flow-A 握手时间重叠:
#   flow-B 握手:          base+0/1/2ms
#   flow-B GET /b:        base+3ms(data) / base+4ms(ack)
#   flow-B 200 OK:        base+5ms(data) / base+6ms(ack)
#   flow-B 挥手:          base+7ms 起 4 个包
#
# 两 flow 在 base+0~6ms 时间窗内交错并行(不同连接,靠 sport 区分);flow-A 的迟到请求
#   (5s+)与 flow-B 无关。若需"严格顺序"(flow-B 必在 flow-A 所有包之后),给 flow-B 显式
#   offset_time 错开到 flow-A 末包之后即可。
link_type: ethernet
base_time: "2024-01-01T00:00:00Z"

flows:
  # flow-A:正常两轮请求/响应 + 一条延迟到 +5s 的迟到请求(插队)。
  - name: http-a
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.80", ttl: 64 }
      - tcp:  { sport: 49152, dport: 80, client_isn: 1000, server_isn: 5000, mss: 1460 }
      - tcp_session: { open: handshake, close: fin }
    messages:
      - from: src
        stack:
          - http_request:
              method: GET
              url: /a
              version: HTTP/1.1
              headers:
                Host: example.com
                Connection: keep-alive

      - from: dst
        stack:
          - http_response:
              version: HTTP/1.1
              status: 200
              reason: OK
              auto_content_length: true
              headers:
                Content-Length: 0
                Connection: keep-alive
              body: resp-a

      # 迟到请求:offset_time 把它钉到"上一条消息(200 OK)末尾 +5s"(相对上一条消息,链式 delta)。
      # 它只影响自己,flow-B 因跨流独立完全不受其影响。
      - from: src
        offset_time: "+5s"
        stack:
          - http_request:
              method: GET
              url: /late
              version: HTTP/1.1
              headers:
                Host: example.com
                Connection: close

  # flow-B:无 offset_time,在 base 起步并发(不接续 flow-A),完全不受 flow-A 内部 +5s
  # 迟到请求的影响。这就是跨流时间独立的体现。
  - name: http-b
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.80", ttl: 64 }
      - tcp:  { sport: 49153, dport: 80, client_isn: 2000, server_isn: 6000, mss: 1460 }
      - tcp_session: { open: handshake, close: fin }
    messages:
      - from: src
        stack:
          - http_request:
              method: GET
              url: /b
              version: HTTP/1.1
              headers:
                Host: example.com
                Connection: keep-alive

      - from: dst
        stack:
          - http_response:
              version: HTTP/1.1
              status: 200
              reason: OK
              auto_content_length: true
              headers:
                Content-Length: 0
                Connection: keep-alive
              body: resp-b
