# examples/icmp_error_fields.yaml
#
# ICMPv4 错误报文类型相关字段规范示例(RFC 792,code 4 的 MTU 见 RFC 1191):
# ① redirect 携带 gateway IPv4(bytes 4-7)
# ② parameter_problem 携带 pointer(byte 4,出错字节偏移)
# ③ destination_unreachable code 4(fragmentation_needed)携带 mtu(bytes 6-7)
link_type: ethernet
seed: 42
packets:
  # ① Redirect + 网关
  - name: udp-probe-redirect
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.20", ttl: 64 }
      - udp:  { sport: 40000, dport: 65000 }
      - payload:
          payload: "probe redirect"

  - name: icmp-redirect
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: redirect
          code: 1
          gateway: 10.0.0.254
          quote_from: udp-probe-redirect

  # ② Parameter Problem + 指针
  - name: udp-probe-parameter-problem
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.1", ttl: 64 }
      - udp:  { sport: 40000, dport: 65001 }
      - payload:
          payload: "probe parameter"

  - name: icmp-parameter-problem
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: parameter_problem
          code: 0
          pointer: 8
          quote_from: udp-probe-parameter-problem

  # ③ Destination Unreachable code 4 + MTU
  - name: udp-probe-fragmentation-needed
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.5", ttl: 64 }
      - udp:  { sport: 40000, dport: 65002 }
      - payload:
          payload: "probe frag"

  - name: icmp-fragmentation-needed
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.10", ttl: 64 }
      - icmp:
          type: destination_unreachable
          code: fragmentation_needed
          mtu: 1492
          quote_from: udp-probe-fragmentation-needed
