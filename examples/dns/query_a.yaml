# examples/dns/query_a.yaml
#
# 最简单的单组 DNS A 记录查询/响应。比 dns/multi.yaml 更小,便于快速理解 DNS 用法。
link_type: ethernet
packets:
  - name: dns-query-a
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "8.8.8.8", ttl: 64 }
      - udp:  { sport: 53000, dport: 53 }
      - dns:
          id: 0x1234
          qr: query
          recursion_desired: true
          questions:
            - { name: "example.com.", type: A, class: IN }

  - name: dns-response-a
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "8.8.8.8", dst: "10.0.0.10", ttl: 64 }
      - udp:  { sport: 53, dport: 53000 }
      - dns:
          id: 0x1234
          qr: response
          recursion_desired: true
          recursion_available: true
          rcode: no_error
          questions:
            - { name: "example.com.", type: A, class: IN }
          answers:
            - { name: "example.com.", type: A, class: IN, ttl: 300, data: "93.184.216.34" }
