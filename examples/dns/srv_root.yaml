# examples/dns/srv_root.yaml
#
# RFC 2782 根 target SRV:"服务不可用"哨兵。owner 名 _sip._tcp.example.com 的 SRV 记录
# target 为根("."),表示该域确定不提供 SIP 服务。流量验证关注点:解析端如何处理"服务
# 显式不可用"声明。
#
# 根 target 必须用 payload_hex 构造:gopacket 对根名 RR 的 RDLENGTH 会多算 1 字节
# (recSize = 6 + len("") + 2 = 8,但根名 wire 仅 1 字节 0x00),结构化路径无法正确编码。
# RDATA = Priority(0) + Weight(0) + Port(0) + 根(0x00) = 7 字节,RDLENGTH 自动 = 7。
link_type: ethernet
packets:
  - name: dns-srv-root
    stack:
      - eth:  { src: "66:77:88:99:aa:bb", dst: "00:11:22:33:44:55" }
      - ipv4: { src: "8.8.8.8", dst: "10.0.0.10", ttl: 64 }
      - udp:  { sport: 53, dport: 53008 }
      - dns:
          id: 0x123c
          qr: response
          rcode: no_error
          questions:
            - { name: "_sip._tcp.example.com.", type: SRV, class: IN }
          answers:
            - { name: "_sip._tcp.example.com.", type: SRV, class: IN, ttl: 300, payload_hex: "0x00000000000000" }
