# examples/telnet/negotiation.yaml
#
# 选项协商序列(stack 模型,演示层栈重复多个 telnet 层拼接):
#   服务器在同一 TCP 段内连续发送多个 IAC 协商命令:
#     IAC WILL ECHO  / IAC WILL SGA / IAC DO SGA / IAC DONT ECHO
#   每个 telnet 层序列化为 3 字节(IAC + cmd + option),SerializeLayers 顺序拼接,
#   自然得到 12 字节连续协商流。验证 command+option 三字节编码与多层拼接。
link_type: ethernet
packets:
  - name: telnet-negotiate
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.21", dst: "10.0.0.10", ttl: 64 }
      - tcp:  { sport: 23, dport: 49160, flags: [PSH, ACK], seq: 5001, ack: 1001 }
      - telnet: { command: WILL, option: ECHO }
      - telnet: { command: WILL, option: SGA }
      - telnet: { command: DO,    option: SGA }
      - telnet: { command: DONT,  option: ECHO }
