# examples/telnet/malformed.yaml
#
# 畸形用例:用既有原始字节层(payload / payload_hex)绕过 telnet 层的自动修正,
# 构造非法 / 非标 TELNET 流量,验证「原始字节兜底」能力(CLAUDE.md 领域约束#1):
#
#   ① 非法 IAC 序列:IAC(0xFF)后跟未知命令码 0xAA(TELNET 未定义)。
#   ② SB 内容含未转义 0xFF:合法协商 IAC SB 24 后,内容里出现裸 0xFF 而非 IAC IAC 转义,
#      这是畸形接收端会解析错误的流量(规范实现应转义 0xFF)。
#   ③ option 码越界用数字私有码:这其实能用 telnet 层表达(数字回退),此处演示
#      WILL + 私有 option 200(0xC8),验证非标 option 走数字写法。
#
# 这些用例刻意不规范,telnet 层的校验/转义会"修正"它们,故须用 payload_hex 直接落原始字节
# (payload_hex 不做任何转义或语义校验),由用户自负字节正确性。
link_type: ethernet
packets:
  # ① 非法 IAC 序列:IAC + 未知码 0xAA
  - name: telnet-bad-iac
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.21", ttl: 64 }
      - tcp:  { sport: 49160, dport: 23, flags: [PSH, ACK], seq: 1001, ack: 5001 }
      - payload_hex: "0xffaa"

  # ② SB 内容含未转义 0xFF:IAC SB 24(=TTYPE) 0xFF 'x' IAC SE
  #    规范实现应输出 IAC IAC 转义,此处故意不转义以制造畸形。
  - name: telnet-unescaped-ff
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.21", ttl: 64 }
      - tcp:  { sport: 49160, dport: 23, flags: [PSH, ACK], seq: 1003, ack: 5001 }
      - payload_hex: "0xfffa18ff78fff0"

  # ③ 非标 option:WILL + 私有 option 200(数字写法,校验接受)
  - name: telnet-private-option
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.21", ttl: 64 }
      - tcp:  { sport: 49160, dport: 23, flags: [PSH, ACK], seq: 1009, ack: 5001 }
      - telnet: { command: WILL, option: "200" }
