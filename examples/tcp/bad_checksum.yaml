# examples/tcp/bad_checksum.yaml
#
# TCP checksum 显式覆盖(三态语义):
# ① 不写 checksum → 自动计算(伪首部绑就近 IPv4);
# ② 写 checksum: 0xdead → 关闭自动计算,值原样上 wire,构造错误校验和流量。
link_type: ethernet
seed: 42
packets:
  # ① 规范包:checksum 自动计算。
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - tcp:  { sport: 40000, dport: 80, flags: [SYN], seq: 1000 }

  # ② 畸形包:checksum 原样落 0xdead(关闭自动计算)。
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - tcp:  { sport: 40000, dport: 80, flags: [SYN], seq: 1000, checksum: 0xdead }
