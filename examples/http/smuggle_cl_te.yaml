# examples/http/smuggle_cl_te.yaml
#
# 请求走私畸形(CL.TE):前端按 Content-Length 切分、后端按 Transfer-Encoding: chunked 解析。
# 通过关掉 auto_content_length(false/缺省)+ 头里手写 Content-Length + 外置 transfer_encoding: chunked
# 自然构造:工具按 chunked 成帧 body,同时原样保留头里的 Content-Length(CLA+TE 并存,
# 触发 CL+TE 冲突告警,但不阻断出包 —— 走私用例照常产出字节)。
link_type: ethernet
seed: 42

flows:
  - name: http-smuggle-cl-te
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.80", ttl: 64 }
      - tcp:  { sport: 49152, dport: 80, client_isn: 1000, server_isn: 5000, mss: 1460 }
      - tcp_session: { open: handshake, close: fin }
    messages:
      - from: src
        stack:
          - http_request:
              method: POST
              url: /api/vulnerable
              version: HTTP/1.1
              transfer_encoding: chunked
              headers:
                Host: example.com
                Content-Type: application/x-www-form-urlencoded
                Content-Length: 6
                Transfer-Encoding: chunked
              # body 经 chunked 成帧(整段一块);手写 CL=6 与 TE 并存 = CL.TE 走私特征。
              body: "hello"
