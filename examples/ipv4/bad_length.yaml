# examples/ipv4/bad_length.yaml
#
# IPv4 长度字段显式覆盖(两态语义):
# ① 不写 length/ihl → 自动计算(total_length=整包字节数含头,ihl=5),与现状逐字节一致;
# ② 写 total_length: 9999 → 关闭该层自动长度修正,值原样上 wire,ihl 未写仍补成 5(公式值)。
#    这是「一个开关控两字段」的补值逻辑:只让 total_length 撒谎,header_length 保持正确。
link_type: ethernet
seed: 42
packets:
  # ① 规范包:长度自动计算。
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - tcp:  { sport: 40000, dport: 80, flags: [SYN], seq: 1000 }

  # ② 畸形包:total_length 原样落 9999(header_length 仍自动 = 5)。
  - stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64, total_length: 9999 }
      - tcp:  { sport: 40000, dport: 80, flags: [SYN], seq: 1000 }
