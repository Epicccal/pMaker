# examples/tftp/read_simple.yaml
#
# 标准读取(RFC 1350,无选项):RRQ 发往服务器 69 端口,服务器从新 TID(54321)发数据。
# 端口切换用两条 flow 表达:flow 1 只承载 RRQ,flow 2 承载数据交换,
# start_after 锚到 RRQ 发出后(见 udp_session.md §端口切换)。
link_type: ethernet
flows:
  - name: tftp-req
    stack:
      - eth:         { src: "00:11:22:33:44:01", dst: "00:11:22:33:44:02" }
      - ipv4:        { src: "10.0.0.1", dst: "10.0.0.2", ttl: 64 }
      - udp:         { sport: 50000, dport: 69 }
      - udp_session: {}
    messages:
      - from: src
        message_id: rrq
        stack:
          - tftp: { opcode: rrq, filename: "hello.txt", mode: octet }

  - name: tftp-data
    start_after: tftp-req.rrq      # RRQ 发出后服务器用新 TID 回复
    stack:
      - eth:         { src: "00:11:22:33:44:02", dst: "00:11:22:33:44:01" }
      - ipv4:        { src: "10.0.0.2", dst: "10.0.0.1", ttl: 64 }
      - udp:         { sport: 54321, dport: 50000 }   # 服务器 TID:54321 → 客户端 TID:50000
      - udp_session: {}
    messages:
      - from: src                  # src = 服务器(TID:54321)
        stack:
          - tftp: { opcode: data, block: 1, data: "Hello, TFTP!" }
      - from: dst                  # dst = 客户端 ACK
        stack:
          - tftp: { opcode: ack, block: 1 }
