# examples/ftp/control_triggers_data.yaml
#
# 演示 start_after 跨流引用:控制通道收到 PASV 227 响应后,数据通道才开始握手。
# 对应真实 FTP:客户端在控制连接上发 PASV,服务端回 227 给出数据端口,客户端据此
# 开数据通道(新 TCP 连接)。数据通道起点因果依赖控制通道里那条 227 消息的完成,
# 不是按固定间隔发包——这正是 start_after 要表达的"显式跨流依赖"。
#
# 时间线(base=2024-01-01T00:00:00Z,默认步长 1ms):
#
#   control 握手:        base+0/1/2ms(msgCursor=3ms)
#   control PASV 请求:  base+3ms(data)/ base+4ms(ack),末尾 5ms
#   control PASV 227:   base+5ms(data)/ base+6ms(ack),msgCursor=7ms  ← message_id: pasv
#   data 握手(SYN 起):  base+7ms(= control.pasv 的 msgCursor,紧接)
#   data 传一段:        base+10ms(data)/ base+11ms(ack)
#
# data 的 SYN 落在 base+7ms = control 的 227 整组完成点(msgCursor),紧接(无额外 offset)。
# 若把控制流任意 offset/段间隔改动,data 起点自动跟随——无需手算绝对时刻。
link_type: ethernet
seed: 42
base_time: "2024-01-01T00:00:00Z"

flows:
  # 控制通道:客户端发 PASV,服务端回 227(最后一条消息,带 message_id 供引用)。
  - name: control
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.80", ttl: 64 }
      - tcp:  { sport: 49152, dport: 21, client_isn: 1000, server_isn: 5000, mss: 1460 }
      - tcp_session: { open: handshake, close: fin }
    messages:
      - from: src
        stack:
          - payload: { payload: "PASV\r\n" }
      - from: dst
        message_id: pasv          # ← 被数据通道引用
        stack:
          - payload: { payload: "227 Entering Passive Mode (10,0,0,80,195,80).\r\n" }

  # 数据通道:控制通道 PASV 227 完成后紧接握手(独立 5 元组,自己的一套 seq/ack)。
  - name: data
    start_after: "control.pasv"
    stack:
      - eth:  { src: "00:11:22:33:44:55", dst: "66:77:88:99:aa:bb" }
      - ipv4: { src: "10.0.0.10", dst: "10.0.0.80", ttl: 64 }
      - tcp:  { sport: 49153, dport: 50000, client_isn: 9000, server_isn: 7000, mss: 1460 }
      - tcp_session: { open: handshake, close: fin }
    messages:
      - from: dst
        stack:
          - payload: { payload: "Welcome to pMaker FTP data channel.\r\n" }
