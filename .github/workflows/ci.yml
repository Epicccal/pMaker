name: CI

# 触发条件:推送到 main、针对 main 的 PR、手动运行。
# 本仓库工作流规范:不直接推送到 main,所有提交经 PR 走 CI 门槛。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支并发只保留最新一次运行,PR 上取消旧 run 节省额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 最小权限原则。PR 来自 fork 时只能拿到只读 token,
# 因此把需要写权限的步骤(覆盖率上传、缓存)单独放到一个 job 里
# 并显式给 permissions。
permissions:
  contents: read

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod 写的是 "go 1.25.0",setup-go 会取 >=1.25 的最新稳定版。
          cache: true

      - name: gofmt 检查
        # -l 列出格式不符的文件;有输出则失败。
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 显式锁定版本,避免随 action 默认值漂移。
          version: v2.12.2
          # 本仓库已带 .golangci.yml,action 会自动读取。
          args: --timeout=5m

  test:
    name: 测试与覆盖率
    runs-on: ubuntu-latest
    # 测试需要写覆盖率文件并向 Codecov 上传,给予相应权限。
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试(带竞态检测与覆盖率)
        # -race 要求 CGO,因此此处不禁用 CGO;本仓库构建产物本身保持 CGO_ENABLED=0,
        # 但测试阶段开 race 检测属于质量门禁,不参与发布构建。
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          # 仓库管理员可在 Codecov 端配置 token;开源仓库可改用 OIDC 无 token 上传,
          # 见 https://github.com/codecov/codecov-action#oauth-token-support。
          # 若用 OIDC,去掉 token 字段并在 Codecov 侧绑定 GitHub App。
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # 覆盖率上传失败不应阻塞 PR
          verbose: true

      - name: 上传覆盖率产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-out
          path: ./coverage.out
          retention-days: 7

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 静态构建(CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/pmaker ./cmd/pmaker
          # 冒烟:确认二进制能跑起来(version 子命令正常退出即可)
          ./bin/pmaker version >/dev/null 2>&1 && echo "build smoke OK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: pmaker-linux-amd64
          path: bin/pmaker
          retention-days: 7
